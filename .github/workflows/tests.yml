# runs the unit tests on every pull request and on every merge to main.
# no API keys needed: the tests never call a model, so CI is free and repeatable.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      # the exact versions from uv.lock, plus pytest
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
